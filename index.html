<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linework Gantt Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F5BD3">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Linework">
<style>
/* Layout idea: a drafting-table scheduler. Cool grey paper, ink type, one cobalt accent for
   selection and actions; colour is spent on task bars and dependency lines. Condensed widths
   of one family carry headings and timeline scales. */
:root{
  --paper:#F2F4F7; --surface:#FFFFFF; --sunk:#E8ECF1; --ink:#172033; --ink-2:#3A4458; --muted:#677086; --faint:#9AA2B2;
  --rule:#DCE1E8; --rule-2:#EDF0F4;
  --accent:#2F5BD3; --accent-2:#2449B0; --on-accent:#FFFFFF; --accent-soft:#E3EAFB;
  --bad:#CF3434; --bad-soft:#FBE8E8; --crit:#D9560F; --crit-soft:#FCEBDD; --ok:#2C8A4B; --ok-soft:#E2F2E7; --warn:#9A6210; --warn-soft:#FAF0DC;
  --nonwork:#F3F5F8; --hol:#E2E7EE; --link:#8790A3; --group:#2A3448;
  --row-sel:#EAF0FD; --row-hov:#F7F9FC;
  --sh-1:0 1px 2px rgba(23,32,51,.07);
  --sh-2:0 2px 6px rgba(23,32,51,.06),0 18px 40px -12px rgba(23,32,51,.28);
  --font-display:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"SF Pro Display",Roboto,sans-serif;
  --font-ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"SF Pro Text",Roboto,sans-serif;
  --row:36px; --head:56px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1218; --surface:#151A22; --sunk:#1D232D; --ink:#E6EAF1; --ink-2:#C3CAD6; --muted:#8F98AA; --faint:#687287;
    --rule:#29303D; --rule-2:#1E242E;
    --accent:#7F9BF6; --accent-2:#A0B4F9; --on-accent:#0E1218; --accent-soft:#1F2A47;
    --bad:#F07070; --bad-soft:#3A1F22; --crit:#F59157; --crit-soft:#3A2618; --ok:#5DC486; --ok-soft:#183324; --warn:#E3B04B; --warn-soft:#33291A;
    --nonwork:#12171F; --hol:#232A35; --link:#6E798D; --group:#C8D0DC;
    --row-sel:#1C2642; --row-hov:#18202A;
    --sh-1:0 1px 2px rgba(0,0,0,.35);
    --sh-2:0 2px 6px rgba(0,0,0,.3),0 18px 40px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1218; --surface:#151A22; --sunk:#1D232D; --ink:#E6EAF1; --ink-2:#C3CAD6; --muted:#8F98AA; --faint:#687287;
  --rule:#29303D; --rule-2:#1E242E;
  --accent:#7F9BF6; --accent-2:#A0B4F9; --on-accent:#0E1218; --accent-soft:#1F2A47;
  --bad:#F07070; --bad-soft:#3A1F22; --crit:#F59157; --crit-soft:#3A2618; --ok:#5DC486; --ok-soft:#183324; --warn:#E3B04B; --warn-soft:#33291A;
  --nonwork:#12171F; --hol:#232A35; --link:#6E798D; --group:#C8D0DC;
  --row-sel:#1C2642; --row-hov:#18202A;
  --sh-1:0 1px 2px rgba(0,0,0,.35);
  --sh-2:0 2px 6px rgba(0,0,0,.3),0 18px 40px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:13px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- app frame ---------- */
#app{display:grid;grid-template-rows:auto auto minmax(0,1fr);height:100%}
.top{display:flex;align-items:center;gap:12px;height:52px;padding:0 10px 0 14px;background:var(--surface);border-bottom:1px solid var(--rule);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:680;font-stretch:80%;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:24px;height:24px;flex:none}
.proj-btn{display:flex;align-items:center;gap:6px;max-width:320px;height:34px;padding:0 8px 0 10px;border:1px solid var(--rule);border-radius:9px;background:var(--surface);font-weight:600;font-size:14px;min-width:0}
.proj-btn:hover{background:var(--sunk)}
.proj-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;align-self:stretch;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tab{position:relative;display:flex;align-items:center;gap:7px;padding:0 11px;border:0;background:none;color:var(--muted);font-weight:560;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:2px;flex:none}
.save{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;margin-right:6px;white-space:nowrap;border:0;background:none;padding:5px 8px;border-radius:7px;cursor:pointer}
.save:hover{background:var(--sunk);color:var(--ink)}
.save::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.save.busy::before{background:var(--warn)}
.save.local::before{background:var(--faint)}
.save.demo::before{background:var(--accent)}
.save.err::before{background:var(--bad)}
.banner{display:flex;align-items:center;gap:12px;padding:7px 14px;background:var(--accent-soft);color:var(--ink);font-size:12.5px;border-bottom:1px solid var(--rule)}
.banner[hidden]{display:none}
.banner .sp{flex:1}
.stage{position:relative;min-height:0;min-width:0}
#main{height:100%;min-height:0}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);font-weight:560;white-space:nowrap;box-shadow:var(--sh-1)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:none;border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn.crit-on{background:var(--crit-soft);border-color:color-mix(in oklab,var(--crit) 40%,var(--rule));color:var(--crit)}
.btn.base-on{background:var(--sunk)}
.btn .chev{margin-right:-3px;opacity:.6}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;border:0;border-radius:8px;background:none;color:var(--ink-2);flex:none}
.ib:hover:not(:disabled){background:var(--sunk);color:var(--ink)}
.ib:disabled{opacity:.35}
.ib.sm{width:26px;height:26px;border-radius:6px}
.seg{display:inline-flex;padding:2px;border-radius:9px;background:var(--sunk);gap:2px;flex:none}
.seg button{height:26px;padding:0 10px;border:0;border-radius:7px;background:none;color:var(--muted);font-weight:560;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
.chip{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:11px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--ink-2)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip svg.i{width:13px;height:13px}
.inp{height:32px;width:100%;padding:0 9px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);min-width:0}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp:disabled{background:var(--paper);color:var(--muted)}
.inp.sm{height:28px;font-size:12px;padding:0 7px}
textarea.inp{height:auto;min-height:76px;padding:8px 9px;resize:vertical;line-height:1.45}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:11.5px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:baseline}
.field output{color:var(--ink);font-variant-numeric:tabular-nums}
.hint{margin:0;font-size:12px;color:var(--muted);line-height:1.45}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
.av{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:9px;font-weight:700;color:#fff;background:var(--c);flex:none;font-stretch:85%;letter-spacing:.02em;box-shadow:0 0 0 1.5px var(--surface)}
.avs{display:inline-flex;align-items:center}
.avs .av+.av{margin-left:-5px}

/* ---------- toolbar ---------- */
.tbar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--rule);background:var(--surface);overflow-x:auto;scrollbar-width:thin;flex:none}
.tbar .grp{display:flex;gap:6px;align-items:center;flex:none}
.tbar .vr{width:1px;height:20px;background:var(--rule);flex:none}
.tbar .sp{flex:1;min-width:8px}
.tbar h1{margin:0;font-family:var(--font-display);font-size:19px;font-weight:660;font-stretch:82%;letter-spacing:-.01em;white-space:nowrap}
.conf-btn{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 4px 0 10px;border:1px solid color-mix(in oklab,var(--bad) 30%,transparent);border-radius:8px;background:var(--bad-soft);color:var(--bad);font-weight:600;white-space:nowrap;flex:none}
.conf-btn b{height:22px;line-height:22px;padding:0 8px;border-radius:6px;background:var(--bad);color:var(--surface);font-weight:650}
.search{position:relative;flex:none}
.search svg{position:absolute;left:9px;top:8px;color:var(--faint)}
.search .inp{padding-left:30px;width:220px;height:30px}

/* ---------- gantt ---------- */
.view{display:flex;flex-direction:column;height:100%;min-height:0}
.gbody{position:relative;display:grid;grid-template-columns:var(--grid-w) 5px minmax(0,1fr);grid-template-rows:minmax(0,1fr);flex:1;min-height:0}
.gpane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface)}
.ghead{height:var(--head);flex:none;display:flex;flex-direction:column;justify-content:flex-end;border-bottom:1px solid var(--rule)}
.ghead .meta{padding:0 12px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.gcols,.grow{display:grid;grid-template-columns:var(--cols);align-items:center}
.gcols{height:30px;color:var(--muted);font-size:11.5px;font-weight:600}
.gcols>div{padding:0 8px;white-space:nowrap;overflow:hidden}
.gcols>div:first-child{padding-left:26px}
.gcols .r{text-align:right}
.gscroll{flex:1;overflow:hidden;position:relative}
.grows{position:relative}
.grow{height:var(--row);border-bottom:1px solid var(--rule-2);user-select:none;-webkit-user-select:none}
.grow:hover{background:var(--row-hov)}
.grow.sel{background:var(--row-sel)}
.grow.drop-into{box-shadow:inset 0 0 0 2px var(--accent)}
.gc{padding:0 8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;color:var(--ink-2)}
.gc.name{display:flex;align-items:center;gap:5px;padding-left:calc(4px + var(--lvl) * 18px);color:var(--ink);font-size:13px}
.grow.is-g .gc.name{font-weight:650}
.gc.dt,.gc.num{font-variant-numeric:tabular-nums}
.gc.num{text-align:right;padding:0 8px 0 2px}
.gc.who{display:flex;align-items:center;gap:6px}
.gc.who span:last-child{overflow:hidden;text-overflow:ellipsis}
.gc.var.late{color:var(--bad);font-weight:600}
.gc.var.early{color:var(--ok);font-weight:600}
.grip{display:grid;place-items:center;width:14px;height:24px;color:var(--faint);opacity:0;cursor:grab;flex:none;touch-action:none}
.grip svg.i{width:12px;height:12px;stroke-width:2.6}
.grow:hover .grip{opacity:1}
.caret{display:grid;place-items:center;width:18px;height:18px;border:0;padding:0;border-radius:4px;background:none;color:var(--muted);flex:none}
.caret:hover{background:var(--sunk);color:var(--ink)}
.caret svg{width:13px;height:13px;transition:transform .15s}
.caret.open svg{transform:rotate(90deg)}
.mk-t{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none;margin:0 4px}
.mk-ms{width:9px;height:9px;background:var(--c);transform:rotate(45deg);border-radius:1.5px;flex:none;margin:0 4.5px}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.flag{color:var(--bad);display:grid;place-items:center;flex:none}
.flag svg.i{width:14px;height:14px}
.grow.add{display:flex;align-items:center;gap:6px;padding-left:26px;color:var(--muted);cursor:pointer;border-bottom:0}
.grow.add:hover{color:var(--accent);background:none}
.grow .edit{width:100%;height:27px;padding:0 6px;border:1px solid var(--accent);border-radius:6px;background:var(--surface);outline:none;box-shadow:0 0 0 3px var(--accent-soft);font-size:12.5px}
.drop-ind{position:absolute;right:8px;height:2px;border-radius:1px;background:var(--accent);pointer-events:none;z-index:3}
.drop-ind::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.reordering{cursor:grabbing}
.split{cursor:col-resize;background:var(--surface);border-left:1px solid var(--rule);border-right:1px solid var(--rule);touch-action:none}
.split:hover,.split.on{background:var(--accent-soft)}

.cpane{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface)}
.chead{height:var(--head);flex:none;overflow:hidden;border-bottom:1px solid var(--rule);position:relative;background:var(--surface)}
.chead-in{position:relative;height:100%}
.ht{position:absolute;top:0;height:26px;border-left:1px solid var(--rule);display:flex;align-items:center}
.ht span{position:sticky;left:0;padding:0 8px;font-family:var(--font-display);font-weight:650;font-stretch:82%;font-size:13px;white-space:nowrap}
.hb{position:absolute;top:26px;height:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--ink-2);border-left:1px solid var(--rule-2);line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.hb small{font-size:9.5px;color:var(--faint)}
.hb.nw{background:var(--nonwork);color:var(--faint)}
.hb.hol{background:repeating-linear-gradient(135deg,var(--nonwork) 0 4px,var(--hol) 4px 6px);color:var(--faint)}
.hb.td{color:var(--accent);font-weight:700}
.hb.td small{color:var(--accent)}
.hb.lft{align-items:flex-start;padding-left:7px}
.today-pill{position:absolute;top:5px;padding:0 7px;height:17px;line-height:17px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:10.5px;font-weight:650;z-index:2;transform:translateX(-50%);pointer-events:none}
.cscroll{flex:1;overflow:auto;position:relative;overscroll-behavior:contain}
.canvas{position:relative;touch-action:none}
.canvas.panning{cursor:grabbing}
.canvas.dragging,.canvas.dragging *{cursor:grabbing!important}
.crow{position:absolute;left:0;right:0;height:var(--row);border-bottom:1px solid var(--rule-2);pointer-events:none}
.crow.sel{background:color-mix(in oklab,var(--row-sel) 75%,transparent)}
svg.bg{position:absolute;left:0;top:0;pointer-events:none}
.bg .nw{fill:var(--nonwork)}
.bg .hb-bg{fill:var(--nonwork)}
.bg .hb-ln{stroke:var(--hol);stroke-width:2.5}
.bg .gl{stroke:var(--rule-2);stroke-width:1}
.bg .gl.m{stroke:var(--rule)}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);opacity:.7;pointer-events:none;z-index:1}

.bar,.msb,.gbar{position:absolute;z-index:3;touch-action:none}
.bar{border-radius:6px;background:color-mix(in oklab,var(--c) 24%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--c) 62%,var(--surface));cursor:grab}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px 0 0 6px;background:var(--c);pointer-events:none}
.bar .fill.full{border-radius:6px}
.bar .pct{position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:10.5px;font-weight:650;color:color-mix(in oklab,var(--c) 55%,var(--ink));pointer-events:none;font-variant-numeric:tabular-nums}
.bar .pct.on{color:#fff}
.bar:hover{box-shadow:inset 0 0 0 1px var(--c),0 3px 10px -3px color-mix(in oklab,var(--c) 55%,transparent)}
.bar.sel,.gbar.sel{outline:2px solid var(--accent);outline-offset:2px}
.bar.crit{box-shadow:inset 0 0 0 1.5px var(--crit),0 0 0 2.5px color-mix(in oklab,var(--crit) 30%,transparent)}
.bar.bad::before,.msb.bad::after{content:"";position:absolute;left:-4px;top:-4px;width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--surface);z-index:2}
.bar.src,.msb.src{outline:2px dashed var(--accent);outline-offset:3px}
.rh{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;z-index:2}
.rh.l{left:-2px}.rh.r{right:-2px}
.rh::after{content:"";position:absolute;top:5px;bottom:5px;left:3.5px;width:2px;border-radius:1px;background:var(--ink-2);opacity:0}
.bar:hover .rh::after{opacity:.55}
.ph{position:absolute;bottom:-8px;width:0;height:0;margin-left:-5px;border:5px solid transparent;border-top:0;border-bottom:6px solid var(--ink-2);cursor:ew-resize;opacity:0;z-index:2}
.ph::after{content:"";position:absolute;left:-8px;top:-6px;width:16px;height:14px}
.bar:hover .ph{opacity:.8}
.dot{position:absolute;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);opacity:0;pointer-events:none;cursor:crosshair;transition:transform .12s,opacity .12s;z-index:4}
.dot::after{content:"";position:absolute;inset:-6px}
.dot.l{left:-19px}.dot.r{right:-19px}
.bar:hover .dot,.msb:hover .dot,.canvas.picking .bar:hover .dot,.tgt .dot{opacity:1;pointer-events:auto}
.canvas.dragging .dot{pointer-events:none}
.dot:hover{background:var(--accent);transform:scale(1.2)}
.tgt-l .dot.l,.tgt-r .dot.r{background:var(--accent);transform:scale(1.3)}
.bar.tgt,.msb.tgt{outline:2px solid var(--accent);outline-offset:3px}
.canvas.picking .bar,.canvas.picking .msb{cursor:copy}
.msb{width:18px;height:18px;cursor:grab}
.msb::before{content:"";position:absolute;inset:2.5px;transform:rotate(45deg);border-radius:3px;background:var(--c);box-shadow:0 0 0 2px var(--surface)}
.msb.sel::before{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.msb.crit::before{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--crit)}
.msb.done::before{background:color-mix(in oklab,var(--c) 45%,var(--surface))}
.gbar{height:9px;border-radius:2px;background:var(--group);cursor:grab}
.gbar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:color-mix(in oklab,var(--accent) 80%,var(--group));pointer-events:none}
.gbar::before,.gbar::after{content:"";position:absolute;bottom:-5px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid var(--group)}
.gbar::before{left:0;border-left:0}
.gbar::after{right:0;border-right:0}
.blab{position:absolute;z-index:3;display:flex;align-items:center;gap:7px;height:20px;font-size:12px;color:var(--muted);white-space:nowrap;pointer-events:none}
.blab b{color:var(--ink-2);font-weight:560}
.bl{position:absolute;height:5px;border-radius:3px;background:color-mix(in oklab,var(--muted) 42%,transparent);z-index:2;pointer-events:none}
.blm{position:absolute;width:8px;height:8px;transform:rotate(45deg);border:1.5px solid var(--muted);z-index:2;pointer-events:none}
.gh-bar{position:absolute;border:1.5px dashed color-mix(in oklab,var(--muted) 75%,transparent);border-radius:6px;z-index:2;pointer-events:none}
.gh-bar.gm{width:14px;height:14px;transform:rotate(45deg);border-radius:2px}
.delta{height:18px;padding:0 6px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:10.5px;font-weight:650;line-height:18px;font-variant-numeric:tabular-nums}
.badge{position:absolute;z-index:8;padding:2px 7px;border-radius:6px;background:var(--ink);color:var(--paper);font-size:11px;font-weight:600;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}

svg.links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:2}
.lk .hit{fill:none;stroke:transparent;stroke-width:11;pointer-events:stroke;cursor:pointer}
.lk .ln{fill:none;stroke:var(--link);stroke-width:1.5;pointer-events:none}
.lk:hover .ln{stroke:var(--accent);stroke-width:2.25}
.lk.bad .ln{stroke:var(--bad);stroke-dasharray:5 3.5;stroke-width:1.75}
.lk.crit .ln{stroke:var(--crit);stroke-width:2.25}
.lk.sel .ln{stroke:var(--accent);stroke-width:2.5}
.ah.n{fill:var(--link)} .ah.bad{fill:var(--bad)} .ah.crit{fill:var(--crit)} .ah.sel{fill:var(--accent)}
.lk:hover .ah{fill:var(--accent)}
.lag rect{fill:var(--surface);stroke:var(--rule)}
.lag text{font-size:10px;font-weight:650;fill:var(--ink-2);font-family:var(--font-ui)}
.lk.bad .lag text{fill:var(--bad)}
svg.link-temp{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:9}
.link-temp path{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4}
.link-temp rect{fill:var(--ink)}
.link-temp text{fill:var(--paper);font-size:11px;font-weight:600;font-family:var(--font-ui)}

.impact{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:12.5px;box-shadow:var(--sh-2);z-index:20;white-space:nowrap;pointer-events:none}
.impact[hidden]{display:none}
.impact .k{opacity:.65}
.impact b{font-weight:650}
.impact .bad{color:#FF9A9A}
.tip{position:absolute;z-index:30;max-width:300px;padding:9px 11px;border-radius:9px;background:var(--surface);border:1px solid var(--rule);box-shadow:var(--sh-2);font-size:12px;line-height:1.5;pointer-events:none}
.tip[hidden]{display:none}
.tip b{display:block;font-size:12.5px;margin-bottom:2px}
.tip .k{color:var(--muted)}
.tip .bad{color:var(--bad)} .tip .ok{color:var(--ok)} .tip .crit{color:var(--crit);font-weight:600}
.pick-hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:21;padding:7px 12px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:12.5px;font-weight:560;box-shadow:var(--sh-2);pointer-events:none;white-space:nowrap}
.empty{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);z-index:4}
.empty h2{margin:0 0 6px;color:var(--ink);font-family:var(--font-display);font-stretch:82%;font-size:20px;font-weight:650}
.empty p{margin:0 0 14px}

/* ---------- drawer ---------- */
.drawer{position:absolute;top:47px;right:0;bottom:0;width:min(392px,100%);z-index:40;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--rule);box-shadow:var(--sh-2)}
.drawer[hidden]{display:none}
.dr-h{display:flex;align-items:center;gap:8px;padding:10px 10px 0 18px}
.dr-kind{font-size:12px;font-weight:600;color:var(--muted)}
.dr-h .sp{flex:1}
.dr-b{flex:1;overflow:auto;padding:6px 18px 18px;display:flex;flex-direction:column;gap:14px}
.dr-name{width:100%;border:0;border-bottom:1px solid transparent;padding:4px 0 6px;background:none;font-family:var(--font-display);font-size:20px;font-weight:650;font-stretch:85%;line-height:1.25;outline:none}
.dr-name:focus{border-bottom-color:var(--accent)}
.frow{display:grid;grid-template-columns:1fr 1fr 82px;gap:8px}
.frow.two{grid-template-columns:1fr}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:24px;height:24px;border-radius:7px;border:0;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.deps h3{margin:4px 0 6px;font-size:12px;font-weight:650;color:var(--ink-2)}
.dep{display:grid;grid-template-columns:118px minmax(0,1fr) 54px 26px;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid var(--rule-2)}
.dep-name{border:0;background:none;padding:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:560}
.dep-name:hover{color:var(--accent)}
.dep .lag{text-align:right;font-variant-numeric:tabular-nums}
.dep-msg{grid-column:1/-1;display:flex;align-items:center;gap:6px;color:var(--bad);font-size:12px}
.dep.bad .dep-name{color:var(--bad)}
.deps select.add{margin-top:8px;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;font-weight:560}
.dr-f{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--rule)}
.dr-facts{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- menus, popovers, modals, toasts ---------- */
.menu{position:fixed;z-index:70;min-width:210px;max-width:340px;max-height:70vh;overflow:auto;padding:5px;border:1px solid var(--rule);border-radius:11px;background:var(--surface);box-shadow:var(--sh-2)}
.mi{display:flex;align-items:center;gap:9px;width:100%;min-height:32px;padding:0 10px;border:0;border-radius:7px;background:none;text-align:left;white-space:nowrap}
.mi:hover:not(:disabled),.mi:focus-visible{background:var(--sunk);outline:none}
.mi:disabled{opacity:.4}
.mi .ck{width:16px;display:grid;place-items:center;color:var(--muted);flex:none}
.mi[aria-checked="true"] .ck{color:var(--accent)}
.mi .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
.mi .k{margin-left:auto;padding-left:14px;color:var(--faint);font-size:11.5px}
.mi.danger{color:var(--bad)}
.mi.danger .ck{color:var(--bad)}
.msep{height:1px;margin:5px 4px;background:var(--rule)}
.mhead{padding:7px 10px 3px;font-size:11.5px;color:var(--muted);font-weight:600}
.pop{position:fixed;z-index:65;width:340px;padding:14px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);box-shadow:var(--sh-2);display:flex;flex-direction:column;gap:11px}
.lp-head{display:flex;align-items:center;gap:7px;font-size:12.5px;min-width:0}
.lp-head b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:620}
.lp-head svg{color:var(--muted)}
.lp-sent{margin:0;font-size:13px;line-height:1.45;color:var(--ink-2)}
.lp-row{display:flex;align-items:center;gap:10px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:8px;overflow:hidden;flex:none}
.stepper button{width:30px;height:30px;border:0;background:var(--surface);font-size:16px;color:var(--ink-2)}
.stepper button:hover{background:var(--sunk)}
.stepper input{width:52px;height:30px;border:0;border-left:1px solid var(--rule);border-right:1px solid var(--rule);text-align:center;background:var(--surface);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.lp-bad{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-size:12.5px}
.lp-bad span{flex:1}
.lp-foot{display:flex;justify-content:space-between;align-items:center;padding-top:2px}
.seg.full{display:grid;grid-template-columns:1fr 1fr}
.seg.full button{padding:0 6px}
.scrim{position:fixed;inset:0;z-index:80;background:color-mix(in oklab,var(--ink) 40%,transparent);display:grid;place-items:center;padding:16px}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;border-radius:14px;background:var(--surface);box-shadow:var(--sh-2);overflow:hidden}
.modal.wide{width:min(680px,100%)}
.modal>header{display:flex;align-items:center;gap:10px;padding:16px 14px 8px 20px}
.modal h2{margin:0;flex:1;font-family:var(--font-display);font-size:19px;font-weight:650;font-stretch:84%;text-wrap:balance}
.modal .mb{padding:6px 20px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal>footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--rule);background:var(--paper)}
.mtext{margin:0;line-height:1.55;color:var(--ink-2)}
.toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;align-items:center;pointer-events:none;transition:opacity .15s}
body.is-dragging .toasts{opacity:0}
body.is-dragging .toast{pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;border-radius:10px;background:var(--ink);color:var(--paper);box-shadow:var(--sh-2);font-size:12.5px;max-width:min(620px,92vw);pointer-events:auto;line-height:1.4}
.toast span{padding:3px 0}
.toast button{flex:none;border:0;background:color-mix(in oklab,var(--paper) 16%,transparent);color:var(--paper);border-radius:7px;height:27px;padding:0 11px;font-weight:620}
.toast button:hover{background:color-mix(in oklab,var(--paper) 26%,transparent)}
.opt-list{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--rule);border-radius:10px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:3px}
.opt b{display:block;font-weight:620}
.opt small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
/* settings */
.tabs2{align-self:flex-start}
.days{display:flex;gap:6px;flex-wrap:wrap}
.day{min-width:52px;height:32px;padding:0 10px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--muted);font-weight:600}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.presets{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--muted)}
.hols{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.hol{display:grid;grid-template-columns:130px 1fr 28px;gap:10px;align-items:center;padding:5px 6px 5px 12px;border-bottom:1px solid var(--rule-2);font-size:12.5px}
.hol:last-child{border-bottom:0}
.hol .d{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.hol-empty{padding:12px;color:var(--muted);font-size:12.5px}
.hol-add{display:grid;grid-template-columns:150px 1fr auto;gap:8px}
.pref{display:grid;grid-template-columns:1fr auto;gap:4px 18px;padding:12px 0;border-bottom:1px solid var(--rule-2)}
.pref b{font-weight:620}
.pref p{grid-column:1;margin:0;color:var(--muted);font-size:12.5px;line-height:1.5}
.switch{grid-row:1/3;grid-column:2;position:relative;width:38px;height:22px;align-self:center}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:11px;background:var(--rule);transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:var(--sh-1);transition:transform .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(16px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.rules{width:100%;border-collapse:collapse;font-size:12.5px}
.rules td{padding:7px 8px;border-bottom:1px solid var(--rule-2);vertical-align:top;line-height:1.45}
.rules td:first-child{white-space:nowrap;font-weight:620;padding-left:0}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:12.5px;align-items:center}
kbd{display:inline-block;min-width:22px;padding:1px 6px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;background:var(--paper);font:600 11px/1.5 var(--font-ui);text-align:center;color:var(--ink-2)}
.blist{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.brow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--rule-2)}
.brow:last-child{border-bottom:0}
.brow small{color:var(--muted);white-space:nowrap}
h4.sub{margin:6px 0 0;font-size:12.5px;font-weight:650}

/* ---------- list view ---------- */
.lscroll{flex:1;overflow:auto;background:var(--surface)}
.ltable{width:100%;border-collapse:separate;border-spacing:0}
.ltable th{position:sticky;top:0;z-index:2;background:var(--surface);text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:10px;border-bottom:1px solid var(--rule);white-space:nowrap}
.ltable td{padding:0 10px;height:38px;border-bottom:1px solid var(--rule-2);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ltable tr:hover td{background:var(--row-hov)}
.ltable tr.lg td{background:var(--paper);font-weight:650;height:34px}
.ltable tr.lg:hover td{background:var(--paper)}
.ltable td.c0{width:44px;padding-left:16px}
.ltable .nmc{padding-left:calc(10px + var(--lvl) * 18px);max-width:440px;overflow:hidden;text-overflow:ellipsis}
.ltable .open{border:0;background:none;padding:0;text-align:left;font-weight:560;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltable .open:hover{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.ltable tr.done .open{color:var(--muted);text-decoration:line-through}
.ltable input[type=checkbox]{width:16px;height:16px;cursor:pointer}
.ltable .who{display:flex;align-items:center;gap:6px}
.mini{display:inline-block;width:84px;height:5px;border-radius:3px;background:var(--sunk);vertical-align:middle;overflow:hidden;margin-right:8px}
.mini i{display:block;height:100%;background:var(--c,var(--accent))}
.lempty{padding:40px;text-align:center;color:var(--muted)}

/* ---------- calendar view ---------- */
.calw{flex:1;overflow:auto;padding:0 14px 24px}
.cal-dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));position:sticky;top:0;background:var(--paper);z-index:6;font-size:11.5px;color:var(--muted);font-weight:600;padding:10px 0 6px}
.cal-dow div{padding-left:9px}
.cal-dow .off{color:var(--faint)}
.cw{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--rule);border-top:1px solid var(--rule);background:var(--surface)}
.cw:first-of-type{border-radius:10px 10px 0 0}
.cw:last-child{border-bottom:1px solid var(--rule)}
.cd{border-right:1px solid var(--rule);padding:6px 8px;font-size:12px;color:var(--ink-2);min-width:0}
.cd.off{background:var(--nonwork)}
.cd.hol{background:repeating-linear-gradient(135deg,var(--nonwork) 0 5px,var(--hol) 5px 7px)}
.cd .dn{display:inline-grid;place-items:center;min-width:22px;height:22px;font-variant-numeric:tabular-nums;font-weight:620}
.cd.out .dn{color:var(--faint)}
.cd.td .dn{border-radius:11px;background:var(--accent);color:var(--on-accent)}
.cd .hn{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbar{position:absolute;height:21px;padding:0 7px;border-radius:5px;background:color-mix(in oklab,var(--c) 22%,var(--surface));box-shadow:inset 3px 0 0 var(--c);font-size:11.5px;line-height:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;color:var(--ink);z-index:2;touch-action:none;font-weight:540}
.cbar.cl{box-shadow:none;border-top-left-radius:0;border-bottom-left-radius:0}
.cbar.cr{border-top-right-radius:0;border-bottom-right-radius:0}
.cbar.done{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in oklab,var(--muted) 60%,transparent)}
.cbar.ms{background:none;box-shadow:none;padding-left:18px}
.cbar.ms::before{content:"";position:absolute;left:4px;top:6px;width:9px;height:9px;transform:rotate(45deg);border-radius:1.5px;background:var(--c)}
.cbar.bad{box-shadow:inset 3px 0 0 var(--bad),inset 0 0 0 1px color-mix(in oklab,var(--bad) 50%,transparent)}
.calw.dragging .cbar{pointer-events:none}
.calw.dragging .cbar.drag{box-shadow:0 6px 16px -6px rgba(0,0,0,.35),inset 3px 0 0 var(--c);z-index:5}
.cal-legend{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.cal-legend i{display:inline-block;width:22px;height:12px;border-radius:2px;background:var(--nonwork);box-shadow:inset 0 0 0 1px var(--rule-2)}

/* ---------- board view ---------- */
.board{flex:1;display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:14px;padding:14px;overflow:auto;align-items:start}
.col{display:flex;flex-direction:column;gap:8px;min-height:240px;padding:10px;border-radius:12px;background:var(--sunk)}
.col.over{box-shadow:inset 0 0 0 2px var(--accent)}
.col h2{display:flex;align-items:center;gap:8px;margin:2px 4px 2px;font-family:var(--font-display);font-size:15px;font-stretch:85%;font-weight:650}
.col h2 .n{color:var(--muted);font-weight:560;font-family:var(--font-ui);font-size:12px;font-stretch:100%}
.col h2 .dotc{width:8px;height:8px;border-radius:50%;background:var(--c)}
.col .hintc{margin:0 4px 2px;color:var(--muted);font-size:11.5px}
.card{position:relative;padding:10px 12px 11px 15px;border-radius:10px;background:var(--surface);box-shadow:var(--sh-1);border:1px solid var(--rule);cursor:grab}
.card:hover{border-color:color-mix(in oklab,var(--accent) 40%,var(--rule))}
.card::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.card .cg{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cn{font-weight:600;margin:1px 0 7px;line-height:1.3;border:0;background:none;padding:0;text-align:left;width:100%}
.card .cn:hover{color:var(--accent)}
.card .cm{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.card .cm .sp{flex:1}
.card .pb{height:4px;border-radius:2px;background:var(--sunk);margin-top:9px;overflow:hidden}
.card .pb i{display:block;height:100%;background:var(--c)}
.card.dragging{opacity:.4}
.card.ms .cn::before{content:"";display:inline-block;width:8px;height:8px;margin-right:7px;transform:rotate(45deg) translateY(-1px);border-radius:1.5px;background:var(--c)}

/* ---------- portfolio ---------- */
.pf{flex:1;overflow:auto;padding:22px 22px 40px}
.pf-top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.pf-top h1{margin:0;font-family:var(--font-display);font-size:28px;font-weight:660;font-stretch:78%;letter-spacing:-.01em;line-height:1.1}
.pf-top p{margin:5px 0 0;color:var(--muted)}
.pf-top .sp{flex:1}
.pf-grid{display:grid;grid-template-columns:minmax(230px,1.25fr) 150px 112px 84px minmax(120px,.7fr) minmax(300px,2fr) 44px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.pf-grid>div{padding:12px;border-bottom:1px solid var(--rule-2);display:flex;align-items:center;gap:8px;min-width:0;font-variant-numeric:tabular-nums}
.pf-grid>div.last{border-bottom:0}
.pf-grid>.pf-h{font-size:11.5px;color:var(--muted);font-weight:600;padding-top:10px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.pf-name{flex-direction:column;align-items:flex-start!important;gap:2px!important}
.pf-name button{border:0;background:none;padding:0;font-weight:640;font-size:14px;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-name button:hover{color:var(--accent)}
.pf-name small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pf-prog{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.pf-prog i{display:block;height:100%;background:var(--accent)}
.pf-tl{position:relative;align-self:stretch;padding:0!important;min-height:58px}
.pf-tl .tk{position:absolute;top:0;bottom:0;border-left:1px solid var(--rule-2)}

function autoProgress(P, cal, T) {

    if (t.end < T) t.progress = 100; else if (t.start >= T) t.progress = 0;

function projStats(P) {
  const cal = Cal(P.settings); rollup(P, cal);
  const ts = P.tasks.filter(t => t.type !== 'group'), T = D.today();
  const st = { n: ts.length, cal, done: 0, late: 0, pct: 0, s: null, e: null, conf: conflicts(P, cal).size, slip: null, next: null, ms: [] };
  if (!ts.length) return st;
  let w = 0, acc = 0; st.s = Infinity; st.e = -Infinity;
  for (const t of ts) {
    st.s = Math.min(st.s, t.start); st.e = Math.max(st.e, t.end);
    const dw = t.type === 'milestone' ? 1 : durOf(cal, t); w += dw; acc += dw * t.progress;
    if (t.progress >= 100) st.done++; else if (t.end < T) st.late++;
    if (t.type === 'milestone') st.ms.push(t);
  }
  st.pct = w ? Math.round(acc / w) : 0;
  const b = P.baselines.find(x => x.id === P.settings.baselineId) || P.baselines[P.baselines.length - 1];
  if (b) { let be = -Infinity; for (const t of ts) { const x = b.tasks[t.id]; if (x) be = Math.max(be, x[1]); } if (isFinite(be)) { st.slip = cal.wdiff(be, st.e); st.bname = b.name; } }
  st.next = ts.filter(t => t.type === 'milestone' && t.progress < 100).sort((a, b) => a.start - b.start)[0] || null;
  return st;
}

/* ============ Import and export ============ */
function toCSV(P) {
  const cal = Cal(P.settings); rollup(P, cal);
  const I = idx(P), m = new Map(P.tasks.map(t => [t.id, t]));
  const rows = [['ID', 'Task', 'Type', 'Group', 'Start', 'End', 'Working days', 'Progress %', 'Assigned', 'Waits on', 'Notes']];
  for (const t of P.tasks) {
    const preds = (I.ins.get(t.id) || []).map(l => `${l.from} ${l.type}${l.lag > 0 ? '+' + l.lag : l.lag < 0 ? l.lag : ''}`).join('; ');
    rows.push([t.id, t.name, t.type, t.parent ? (m.get(t.parent) || {}).name || '' : '', D.toISO(t.start), D.toISO(t.end), t.type === 'milestone' ? 0 : cal.count(t.start, t.end), t.progress, t.assignee, preds, t.notes]);
  }
  return '﻿' + rows.map(r => r.map(v => { const s = String(v == null ? '' : v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n');
}
function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50) || 'project'; }
function openExport() {
  const P = App.active;
  const gen = s => {
    const v = s.querySelector('input[name=ex]:checked').value;
    if (v === 'csv') return { name: slug(P.name) + '.csv', text: toCSV(P), mime: 'text/csv' };
    if (v === 'all') return { name: 'linework-all-projects.json', text: JSON.stringify({ app: 'linework', v: 1, projects: App.projects.map(serialize) }, null, 1), mime: 'application/json' };
    return { name: slug(P.name) + '.json', text: JSON.stringify(Object.assign({ app: 'linework', v: 1 }, serialize(P)), null, 1), mime: 'application/json' };
  };
  modal({
    title: 'Export', body: `<div class="opt-list">
      <label class="opt"><input type="radio" name="ex" value="json" checked><span><b>This project as a backup (.json)</b><small>Everything in ${esc(P.name)}. Import it here on any device.</small></span></label>
      <label class="opt"><input type="radio" name="ex" value="all"><span><b>All ${plural(App.projects.length, 'project')} (.json)</b><small>One file with every project.</small></span></label>
      <label class="opt"><input type="radio" name="ex" value="csv"><span><b>Task table (.csv)</b><small>Opens in Excel or Google Sheets. Dates, durations, progress and dependencies.</small></span></label></div>
`,
    actions: [{ label: 'Copy to clipboard', act: s => { copyText(gen(s).text); return false; } }, { label: 'Download', primary: true, act: s => { const f = gen(s); saveFile(f.name, f.text, f.mime).then(ok => { if (!ok) toast('The download was blocked. Use Copy to clipboard instead.'); }); } }],
  });
}
function importFile(file) {
  const r = new FileReader();
  r.onload = () => {
    let o; try { o = JSON.parse(String(r.result).replace(/^﻿/, '')); } catch (e) { toast('That file isn’t valid JSON. Choose a backup exported from this app.'); return; }
    const list = Array.isArray(o.projects) ? o.projects : [o];
    const made = [];
    for (const x of list) {
      const P = deserialize(x); if (!P) continue;
      if (App.projects.some(p => p.id === P.id)) { P.id = newId('p-'); P.name += ' (imported)'; }
      P.demo = false; P.created = Date.now() + made.length; App.projects.push(P); made.push(P);
    }
    if (!made.length) { toast('No projects found in that file.'); return; }
    App.projects.forEach(p => { p.demo = false; });
    made.forEach(p => markDirty(p));
    setActive(made[0]); setView(App.view === 'portfolio' ? 'gantt' : App.view);
    toast(`Imported ${made.length === 1 ? made[0].name : plural(made.length, 'project')}.`);
  };
  r.readAsText(file);
}

/* ============ Shell: views, top bar, keyboard, boot ============ */
const VIEWS = ['portfolio', 'gantt', 'list', 'calendar', 'board'];
function mountView() {
  App.mounted = App.view; EL = {}; CAL = {};
  ({ gantt: mountGantt, list: mountList, calendar: mountCalendar, board: mountBoard, portfolio: mountPortfolio })[App.view]();
}
function render() {
  if (!App.active) return;
  if (App.mounted !== App.view) mountView();
  App.cal = App.cal || Cal(App.active.settings);
  updateTop();
  if (App.view === 'gantt') renderGantt();
  else if (App.view === 'list') renderList();
  else if (App.view === 'calendar') renderCalendar();
  else if (App.view === 'board') renderBoard();
  else renderPortfolio();
  renderDrawer();
  updatePeople();
}
function setView(v, fromHash) {
  if (!VIEWS.includes(v)) v = 'gantt';
  if (App.drag) cancelDrag();
  App.pick = null; closeMenus(); closePop();
  App.view = v;
  if (v === 'gantt') App.needScroll = true;
  if (!fromHash && location.hash.slice(1) !== v) { try { location.hash = v; } catch (e) { } }
  render();
}
function setActive(P, quiet) {
  if (!P) return;
  App.active = P; App.cal = Cal(P.settings);
  App.sel = new Set(); App.selLink = null; App.drawer = null; App.pick = null; App.geom = null; App.needScroll = true;
  closePop();
  saveLocalSoon();
  if (!quiet || App.mounted) render();
}
function updateTop() {
  const P = App.active;
  $('#proj-name').textContent = P.name;
  $$('#tabs .tab').forEach(b => { const on = b.dataset.view === App.view; b.classList.toggle('on', on); b.setAttribute('aria-current', on ? 'page' : 'false'); });
  const h = hist(P);
  $('#undo-btn').disabled = !h.undo.length; $('#redo-btn').disabled = !h.redo.length;
  updateSave(); updateBanner();
}
function updateBanner() {
  const el = $('#banner'); if (!el) return;
  const demo = App.projects.length && App.projects.every(p => p.demo) && !App.bannerOff;
  el.hidden = !demo;
  if (demo && !el.childElementCount) {
    el.innerHTML = `<span>These are example projects. Change anything and they become yours, or start from a blank page.</span><span class="sp"></span><button class="btn" data-act="blank">${ic('plus')}Blank project</button><button class="ib sm" data-act="x" aria-label="Hide this message">${ic('x')}</button>`;
  }
}
function updatePeople() {
  const set = new Set();
  for (const P of App.projects) for (const t of P.tasks) peopleOf(t.assignee).forEach(n => set.add(n));
  const html = [...set].sort().map(n => `<option value="${esc(n)}"></option>`).join('');
  const dl = $('#people-list'); if (dl.innerHTML !== html) dl.innerHTML = html;
}
function projectSwitcher(anchor) {
  const items = [{ head: 'Projects' }];
  for (const P of App.projects) items.push({ label: P.name, checked: P === App.active, act: () => { setActive(P); if (App.view === 'portfolio') setView('gantt'); } });
  items.push('sep', { label: 'All projects', icon: 'grid', act: () => setView('portfolio') }, { label: 'New project…', icon: 'plus', act: newProjectDialog });
  openMenu(0, 0, items, anchor);
}
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
window.addEventListener('appinstalled', () => { installEvt = null; toast('Linework is installed. Open it from your Start menu, dock or home screen.'); });
function installApp() {
  if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; }); return; }
  const ios = /iPhone|iPad/.test(navigator.userAgent);
  modal({ title: 'Install Linework', body: ios
    ? '<p class="mtext">In Safari, tap the Share button, then <b>Add to Home Screen</b>. Linework then opens like an app and works offline.</p>'
    : '<p class="mtext">In Chrome or Edge, open the browser menu and choose <b>Install Linework</b> (Chrome: Cast, save and share, then Install page as app). If you don’t see it, it’s already installed, or this page was opened from a file rather than its web link.</p><p class="hint">Installing needs no admin rights; it only adds a shortcut. A bookmark works too: once opened online, the page keeps working offline.</p>',
    actions: [{ label: 'OK', primary: true }] });
}
function moreMenu(anchor) {
  openMenu(0, 0, [
    { label: 'Drive sync…', icon: 'upload', act: openSyncSetup },
    { label: 'Sync now', icon: 'redo', act: () => syncNow(true), disabled: !syncReady() },
    { label: 'Install on this device…', icon: 'pin', act: installApp },
    'sep',
    { label: 'Export…', icon: 'download', act: openExport },
    { label: 'Import from a backup file…', icon: 'upload', act: () => $('#file-in').click() },
    'sep',
    { label: 'Shortcuts and dependency rules', icon: 'help', k: '?', act: openHelp },
    'sep',
    { label: `Delete ${App.active.name}…`, icon: 'trash', danger: true, act: () => deleteProject(App.active) },
  ], anchor);
}
function onKey(e) {
  if (e.key === 'Escape') {
    if ($('.scrim')) return;
    if (App.drag) { cancelDrag(); e.preventDefault(); return; }
    if (closeTop()) { e.preventDefault(); return; }
    if (App.pick) { App.pick = null; render(); return; }
    if (App.drawer && !e.target.closest('input,textarea,select')) { App.drawer = null; renderDrawer(); return; }
    if ((App.sel.size || App.selLink) && !e.target.closest('input,textarea,select')) { App.sel.clear(); App.selLink = null; render(); }
    return;
  }
  if (e.key === 'Alt' && App.drag) { e.preventDefault(); App.drag.alt = true; updateDrag(App.drag.last); return; }
  const tg = e.target;
  if (tg.closest && tg.closest('input,textarea,select,[contenteditable="true"]')) return;
  if ($('.scrim') || App.menuEl) return;
  const mod = e.metaKey || e.ctrlKey, k = e.key;
  if (mod && (k === 'z' || k === 'Z')) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (mod && (k === 'y' || k === 'Y')) { e.preventDefault(); redo(); return; }
  if (mod || e.altKey) return;
  if (k === '?') { openHelp(); return; }
  if (App.view === 'portfolio') return;
  const one = App.sel.size === 1 ? [...App.sel][0] : null;
  if (k === 'Delete' || k === 'Backspace') { if (App.sel.size || App.selLink) { e.preventDefault(); deleteSel(); } return; }
  if (k === 'n' || k === 'N') { e.preventDefault(); addItem('task'); return; }
  if (k === 'e' || k === 'E') { if (one) { e.preventDefault(); openDrawer(one); } return; }
  if (App.view !== 'gantt') return;
  switch (k) {
    case 'Enter': e.preventDefault(); addItem('task'); break;
    case 'm': case 'M': e.preventDefault(); addItem('milestone'); break;
    case 'g': case 'G': e.preventDefault(); addItem('group'); break;
    case 'F2': if (one) { e.preventDefault(); startEdit(one, 'name'); } break;
    case 'Tab': if (App.sel.size) { e.preventDefault(); if (e.shiftKey) outdentSel(); else indentSel(); } break;
    case 'D': if (e.shiftKey) { e.preventDefault(); chainSel(); } break;
    case 'ArrowDown': e.preventDefault(); moveSel(1, e.shiftKey); break;
    case 'ArrowUp': e.preventDefault(); moveSel(-1, e.shiftKey); break;
    case '1': case '2': case '3': case '4': setZoom(Object.keys(ZOOMS)[+k - 1]); break;
    case 't': case 'T': scrollToDay(D.today(), 0.22, true); break;
    case 'c': case 'C': toggleCritical(); break;
  }
}
function boot() {
  $('#undo-btn').innerHTML = ic('undo'); $('#redo-btn').innerHTML = ic('redo');
  $('#help-btn').innerHTML = ic('help'); $('#more-btn').innerHTML = ic('more'); $('#set-btn').innerHTML = ic('sliders');
  $('#proj-btn').insertAdjacentHTML('beforeend', ic('chev', 'chev'));
  $('#proj-btn').addEventListener('click', e => projectSwitcher(e.currentTarget));
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) setView(b.dataset.view); });
  $('#undo-btn').addEventListener('click', undo); $('#redo-btn').addEventListener('click', redo);
  $('#help-btn').addEventListener('click', openHelp);
  $('#more-btn').addEventListener('click', e => moreMenu(e.currentTarget));
  $('#set-btn').addEventListener('click', () => openSettings());
  $('#banner').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.act === 'x') { App.bannerOff = true; updateBanner(); }
    else if (b.dataset.act === 'blank') { const P = blankProject(); App.projects.push(P); setActive(P); markDirty(P); setView('gantt'); }
  });
  $('#file-in').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importFile(f); e.target.value = ''; });
  wireDrawer();
  $('#save').addEventListener('click', openSyncSetup);
  document.addEventListener('keydown', onKey);
  document.addEventListener('keyup', e => { if (e.key === 'Alt' && App.drag) { App.drag.alt = false; updateDrag(App.drag.last); } });
  window.addEventListener('pointermove', e => {
    const p = App.pending;
    if (p && !App.drag && Math.hypot(e.clientX - p.x0, e.clientY - p.y0) > 3) { startDrag(p, e); if (!App.drag) App.pending = null; else document.body.classList.add('is-dragging'); }
    if (App.drag) { App.drag.last = e; if (App.drag.alt !== e.altKey) App.drag.alt = e.altKey; updateDrag(e); }
  });
  window.addEventListener('pointerup', e => {
    document.body.classList.remove('is-dragging');
    if (App.drag) endDrag(e);
    else if (App.pending) clickPending(App.pending, e);
    App.pending = null;
  });
  window.addEventListener('pointercancel', () => { if (App.drag) cancelDrag(); App.pending = null; });
  window.addEventListener('blur', () => { if (App.drag) cancelDrag(); App.pending = null; });
  document.addEventListener('pointerdown', e => {
    if (App.menuEl && !App.menuEl.contains(e.target)) closeMenus();
    if (App.popEl && !App.popEl.contains(e.target) && !(e.target.closest && e.target.closest('.lk'))) { closePop(); if (App.selLink) { App.selLink = null; if (App.view === 'gantt') renderChart(); } }
  }, true);
  window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS.includes(v) && v !== App.view) setView(v, true); });
  let rz = 0;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (App.view === 'gantt' && !App.drag) { if (EL.body) EL.body.style.setProperty('--grid-w', gridW() + 'px'); render(); } }, 120); });

  syncLoad();
  const link = readSetupHash();
  const hv = location.hash.slice(1);
  App.view = VIEWS.includes(hv) ? hv : 'gantt';
  const data = loadLocal();
  App.projects = data && Array.isArray(data.projects) ? data.projects.map(deserialize).filter(Boolean) : [];
  if (data && data.ui && data.ui.gridW) App.ui.gridW = data.ui.gridW;
  if (!App.projects.length) App.projects = demoProjects();
  App.projects.sort((a, b) => a.created - b.created);
  App.active = App.projects.find(p => p.id === (data && data.active)) || App.projects[0];
  App.cal = Cal(App.active.settings);
  render(); updateBanner(); updateSave();
  syncInit();
  if (link) offerSetupLink(link);
  else if (syncReady()) setTimeout(() => syncNow(false), 300);
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(() => { });
  }
}
boot();
</script>
